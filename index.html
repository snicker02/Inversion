<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inversion — circle-inversion, Kleinian &amp; sphere-packing explorer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="brand">
      <h1>Inversion <span id="ver"></span></h1>
      <p>Packings, Schottky and Kleinian groups, and their 3D cousins, all generated by inversion in circles and spheres.</p>
    </div>
    <div id="controls"></div>
  </aside>
  <main id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="err"></div>
    <button id="menu" aria-label="Toggle controls">&#9776;</button>
  </main>
</div>
<noscript><p style="padding:2em;color:#e8b163">Inversion needs JavaScript and must be served over http(s) because it is built from ES modules.</p></noscript>
<script>
  if (location.protocol === "file:") {
    var e = document.getElementById("err");
    e.style.display = "grid";
    e.textContent = "Inversion is built from ES modules, which browsers will not load from file://.\n\nServe the folder instead, e.g.  python3 -m http.server  in this directory, then open http://localhost:8000/";
  }
</script>
<script src="https://snicker02.github.io/shared/bridge.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
